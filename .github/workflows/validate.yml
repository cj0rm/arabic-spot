name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skill-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate package
        run: python3 scripts/validate.py
      - name: Test optional scanner integration
        run: python3 -m unittest discover -s tests -v
